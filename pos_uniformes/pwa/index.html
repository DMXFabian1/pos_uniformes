<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a84f2d">
<title>MAXIMODA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --crema:#f4ede2; --carta:#fffdf8; --tinta:#2c2a27; --tenue:#5f594f;
  --acento:#a84f2d; --acento-osc:#8a4326; --borde:#ddd0c0;
  --azul-bg:#dce8f7; --azul:#2b5c8a; --rojo-bg:#f6d3cb; --rojo:#a33b25;
  --verde-bg:#d9ecd0; --verde:#3d6b2f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--crema); color:var(--tinta);
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px;
  padding-bottom:env(safe-area-inset-bottom); overscroll-behavior-y:contain}
#ptr{position:fixed; top:-56px; left:50%; margin-left:-22px; width:44px; height:44px;
  border-radius:50%; background:var(--carta); border:1px solid var(--borde);
  display:flex; align-items:center; justify-content:center; font-size:22px;
  color:var(--acento-osc); font-weight:800; z-index:60;
  box-shadow:0 3px 10px rgba(0,0,0,.15); transition:top .18s}
#ptr.girando{animation:ptr-spin .7s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
.app{max-width:520px; margin:0 auto; padding:16px}
h1{font-size:22px; color:var(--acento-osc); margin:10px 0 2px}
.sub{color:var(--tenue); font-size:13px; margin:0 0 14px}
.card{background:var(--carta); border:1px solid var(--borde); border-radius:16px;
  padding:16px; margin-bottom:12px}
.banner{background:var(--acento); color:#fff; border:none; font-weight:700;
  font-size:17px; line-height:1.5}
.big{font-size:34px; font-weight:800; margin:2px 0}
.fila{display:flex; justify-content:space-between; align-items:center; padding:10px 0;
  border-bottom:1px solid var(--borde); font-weight:600}
.fila:last-child{border-bottom:none}
.fila .monto{font-weight:800; font-size:18px}
button{width:100%; border:none; border-radius:14px; min-height:54px; font-size:17px;
  font-weight:800; cursor:pointer}
.btn-acento{background:var(--acento); color:#fff}
.btn-suave{background:var(--carta); color:var(--acento-osc); border:1px solid var(--borde)}
input,select{width:100%; border:1px solid var(--borde); border-radius:12px;
  min-height:52px; font-size:17px; padding:0 14px; background:var(--carta);
  color:var(--tinta); margin-bottom:12px}
.error{color:var(--rojo); font-weight:700; margin:8px 0}
.oculto{display:none}
/* calendario */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px}
.cal .cab{font-size:11px; color:var(--tenue); text-align:center; font-weight:700}
.cal .dia{aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:10px; font-weight:700; font-size:14px; background:var(--carta);
  border:1px solid var(--borde)}
.cal .vacio{background:transparent; border:none}
.cal .descanso{background:var(--azul-bg); color:var(--azul); border-color:transparent}
.cal .falta{background:var(--rojo-bg); color:var(--rojo); border-color:transparent}
.cal .pago{background:var(--verde-bg); color:var(--verde); border-color:transparent}
.cal .hoy{outline:2px solid var(--acento)}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-top:4px}
.cal-nav button{width:44px; min-height:44px; font-size:18px}
.leyenda{font-size:12px; color:var(--tenue); margin-top:8px}
.leyenda span{padding:2px 8px; border-radius:8px; margin-right:6px}
.salir{margin-top:16px}
.pill{font-size:12px; background:var(--crema); border:1px solid var(--borde);
  border-radius:99px; padding:3px 10px; color:var(--tenue)}
.nav{position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px;
  background:var(--carta); border-top:1px solid var(--borde); padding:8px 12px
  calc(8px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto}
.nav button{min-height:48px; font-size:15px; background:transparent;
  color:var(--tenue); border-radius:12px}
.nav button.activa{background:var(--crema); color:var(--acento-osc)}
.con-nav{padding-bottom:84px}
.fila-busca{display:flex; gap:8px}
.fila-busca input{flex:1; margin-bottom:0}
.fila-busca button{width:56px; min-height:52px; font-size:22px}
#lector{border-radius:16px; overflow:hidden; margin-top:12px}
.precio-grande{font-size:38px; font-weight:800; color:var(--acento-osc); margin:4px 0}
.talla-chip{display:inline-block; background:var(--crema); border:1px solid var(--borde);
  border-radius:10px; padding:8px 12px; margin:4px 6px 0 0; font-weight:700}
.stock-ok{color:var(--verde)} .stock-mal{color:var(--rojo)}
.copias{display:flex; align-items:center; gap:12px; margin:10px 0}
.copias button{width:52px; min-height:48px; font-size:22px}
.copias span{font-size:22px; font-weight:800; min-width:36px; text-align:center}
.btn-grande{background:var(--carta); color:var(--tinta); border:2px solid var(--borde);
  border-radius:16px; min-height:64px; font-size:19px; font-weight:700; margin-bottom:12px}
.btn-grande:active{background:#f1e6d6}
.listo-texto{font-size:26px; font-weight:800; margin:24px 0; line-height:1.4}
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <div id="vista-login">
    <h1>MAXIMODA</h1>
    <p class="sub">Libreta móvil</p>
    <div class="card">
      <label>¿Quién eres?</label>
      <select id="login-quien"></select>
      <label>Tu PIN</label>
      <input id="login-pin" type="password" inputmode="numeric" placeholder="••••">
      <div id="login-error" class="error oculto"></div>
      <button class="btn-acento" onclick="entrar()">Entrar</button>
    </div>
  </div>

  <!-- EMPLEADA -->
  <div id="vista-empleada" class="oculto">
    <h1 id="emp-hola"></h1>
    <p class="sub" id="emp-fecha"></p>
    <div class="card banner" id="emp-banner"></div>
    <div class="card">
      <div class="cal-nav">
        <button class="btn-suave" onclick="moverMes(-1)">◀</button>
        <strong id="cal-titulo"></strong>
        <button class="btn-suave" onclick="moverMes(1)">▶</button>
      </div>
      <div class="cal" id="cal-grid"></div>
      <div class="leyenda">
        <span style="background:var(--azul-bg);color:var(--azul)">Descanso</span>
        <span style="background:var(--rojo-bg);color:var(--rojo)">Falta</span>
        <span style="background:var(--verde-bg);color:var(--verde)">Pago</span>
      </div>
    </div>
    <button class="btn-suave salir" onclick="salir()">Salir</button>
  </div>

  <!-- ENCARGADO (León) — espejo de su modo del kiosko -->
  <div id="vista-encargado" class="oculto con-nav">
    <div id="enc-menu">
      <h1>¿Qué quieres hacer?</h1>
      <p class="sub" id="enc-modo"></p>
      <button class="btn-grande" onclick="encApuntar()">🗓  Apuntar falta o descanso</button>
      <button class="btn-grande" onclick="encVerCortes()">💵  Ver cortes</button>
      <button class="btn-grande" onclick="encCorteHoy()">🧾  Hacer corte de hoy</button>
      <div class="card" id="enc-descansos"></div>
      <button class="btn-suave" onclick="salir()">Salir</button>
    </div>
    <div id="enc-sub"></div>
  </div>

  <!-- DUEÑO -->
  <div id="vista-dueno" class="oculto">
    <h1>📒 Tu tienda</h1>
    <p class="sub" id="dueno-fecha"></p>
    <div class="card banner">
      <div>VENTA DE HOY</div>
      <div class="big" id="d-venta"></div>
      <div id="d-detalle"></div>
    </div>
    <div class="card">
      <strong>Hoy por empleada</strong>
      <div id="d-ranking"></div>
    </div>
    <div class="card">
      <strong>Ciclos (comisiones desde su último pago)</strong>
      <div id="d-ciclos"></div>
    </div>
    <div class="card">
      <strong>Últimos cortes</strong>
      <div id="d-cortes"></div>
    </div>
    <button class="btn-suave salir" onclick="salir()">Salir</button>
  </div>

  <!-- BUSCAR (todos los roles) -->
  <div id="vista-buscar" class="oculto con-nav">
    <h1>🔍 Buscar precio</h1>
    <p class="sub" id="buscar-modo"></p>
    <div class="fila-busca">
      <input id="buscar-texto" placeholder="Nombre, escuela o código..."
             onkeydown="if(event.key==='Enter')buscarTexto()">
      <button class="btn-suave" onclick="buscarTexto()">🔎</button>
      <button class="btn-acento" onclick="abrirEscaner()">📷</button>
    </div>
    <div id="lector" class="oculto"></div>
    <div id="buscar-resultado"></div>
  </div>

  <div id="nav" class="nav oculto">
    <button id="nav-inicio" class="activa" onclick="irInicio()">🏠 Inicio</button>
    <button id="nav-buscar" onclick="irBuscar()">🔍 Buscar</button>
  </div>

</div>
<script src="html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["lun","mar","mié","jue","vie","sáb","dom"];
let token = localStorage.getItem("pos_token") || "";
let calY = 0, calM = 0;
let rolActual = "", vistaInicio = "", modoServidor = "casa";
let escaner = null;

const pesos = s => "$" + Number(s).toLocaleString("es-MX", {minimumFractionDigits: 2});
// Fecha LOCAL (toISOString es UTC y por la tarde ya marca "manana")
const hoyISO = () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fechaLarga = iso => { const [y,m,d] = iso.split("-").map(Number);
  const f = new Date(y, m-1, d);
  return ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][f.getDay()] + ` ${d} de ${MESES[m-1]}`; };

async function api(ruta) {
  const r = await fetch(ruta, {headers: {"Authorization": "Bearer " + token}});
  if (r.status === 401) { salir(); throw new Error("sesion"); }
  if (!r.ok) throw new Error("api");
  return r.json();
}

function mostrar(vista) {
  for (const v of ["login","empleada","encargado","dueno","buscar"]) $("vista-"+v).classList.add("oculto");
  $("vista-"+vista).classList.remove("oculto");
  const logueado = vista !== "login";
  $("nav").classList.toggle("oculto", !logueado);
  $("nav-inicio").classList.toggle("activa", vista !== "buscar");
  $("nav-buscar").classList.toggle("activa", vista === "buscar");
  if (logueado && vista !== "buscar") vistaInicio = vista;
  if (vista !== "buscar") cerrarEscaner();
}

function irInicio() { mostrar(vistaInicio || "login"); }
function irBuscar() {
  $("buscar-modo").textContent = modoServidor === "tienda"
    ? "Conectado a la tienda — puedes mandar etiquetas a imprimir"
    : "Modo consulta (fuera de la tienda)";
  mostrar("buscar");
}

async function cargarLogin() {
  mostrar("login");
  try {
    const emps = await (await fetch("/api/v1/auth/employees")).json();
    $("login-quien").innerHTML = emps.map(e =>
      `<option value="${e.id}">${e.nombre_visible || e.nombre_completo}</option>`).join("");
  } catch (e) {
    $("login-error").textContent = "No se pudo conectar. Revisa tu conexión.";
    $("login-error").classList.remove("oculto");
  }
}

async function entrar() {
  $("login-error").classList.add("oculto");
  try {
    const r = await fetch("/api/v1/auth/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({employee_id: Number($("login-quien").value),
                            pin: $("login-pin").value, device_id: "pwa"}),
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    token = data.access_token || data.token;
    localStorage.setItem("pos_token", token);
    $("login-pin").value = "";
    await cargarInicio();
  } catch (e) {
    $("login-error").textContent = "PIN incorrecto o sin conexión.";
    $("login-error").classList.remove("oculto");
  }
}

function salir() { token = ""; localStorage.removeItem("pos_token"); cargarLogin(); }

async function cargarInicio() {
  const data = await api("/api/v1/movil/inicio");
  rolActual = data.rol; modoServidor = data.modo || "casa";
  if (data.rol === "empleada") pintarEmpleada(data);
  else if (data.rol === "encargado") pintarEncargado(data);
  else pintarDueno(data);
}

// ── Buscador + escáner ─────────────────────────────────────────────
async function buscarTexto() {
  const q = $("buscar-texto").value.trim();
  if (!q) return;
  cerrarEscaner();
  $("buscar-resultado").innerHTML = "<div class='card'>Buscando...</div>";
  try {
    const data = await api("/api/v1/search?q=" + encodeURIComponent(q));
    const fams = data.families || [];
    if (!fams.length) { $("buscar-resultado").innerHTML = "<div class='card'>Nada con ese nombre. 🤷</div>"; return; }
    $("buscar-resultado").innerHTML = fams.slice(0, 8).map(f => {
      const tallas = f.variantes.map(v =>
        `<span class="talla-chip" onclick="buscarSku('${v.sku}')">${v.talla}${v.color ? " · " + v.color : ""}</span>`).join("");
      return `<div class="card"><strong>${f.nombre_base}</strong>` +
        `<div class="sub">${f.tipo_pieza} · desde ${pesos(f.precio_desde)}</div>` +
        `<div>${tallas}</div></div>`;
    }).join("");
  } catch (e) { $("buscar-resultado").innerHTML = "<div class='card'>No se pudo buscar. Revisa la conexión.</div>"; }
}

async function buscarSku(codigo) {
  cerrarEscaner();
  $("buscar-resultado").innerHTML = "<div class='card'>Buscando...</div>";
  try {
    const v = await api("/api/v1/catalog/sku/" + encodeURIComponent(codigo.trim()));
    const stockCls = v.stock_actual > 0 ? "stock-ok" : "stock-mal";
    const stockTxt = v.stock_actual > 0 ? `${v.stock_actual} en stock` : "AGOTADO";
    let botones = "";
    if (modoServidor === "tienda") {
      botones = `<div class="copias">
          <button class="btn-suave" onclick="cambiarCopias(-1)">−</button>
          <span id="et-copias">1</span>
          <button class="btn-suave" onclick="cambiarCopias(1)">+</button>
          <button class="btn-acento" style="flex:1" onclick="mandarEtiqueta('${v.sku}')">🏷 Imprimir etiqueta</button>
        </div><div id="et-aviso" class="sub"></div>`;
    }
    $("buscar-resultado").innerHTML = `<div class="card">
        <strong>${v.nombre}</strong>
        <div class="sub">${v.categoria} · ${v.marca} · Talla ${v.talla}${v.color ? " · " + v.color : ""} · ${v.sku}</div>
        <div class="precio-grande">${pesos(v.precio_venta)}</div>
        <div class="${stockCls}" style="font-weight:800">${stockTxt}</div>
        ${botones}</div>`;
  } catch (e) {
    $("buscar-resultado").innerHTML = "<div class='card'>No encontré ese código. Prueba buscar por nombre.</div>";
  }
}

function cambiarCopias(d) {
  const el = $("et-copias");
  el.textContent = Math.min(20, Math.max(1, Number(el.textContent) + d));
}

async function mandarEtiqueta(sku) {
  const aviso = $("et-aviso");
  aviso.textContent = "Enviando a la impresora...";
  try {
    const r = await fetch("/api/v1/movil/etiqueta", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
      body: JSON.stringify({sku, copies: Number($("et-copias").textContent)}),
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    aviso.textContent = `✅ En cola: ${data.copias} etiqueta(s) saliendo en la impresora de la tienda.`;
  } catch (e) { aviso.textContent = "❌ No se pudo encolar. Intenta otra vez."; }
}

async function abrirEscaner() {
  if (escaner) { cerrarEscaner(); return; }
  $("lector").classList.remove("oculto");
  escaner = new Html5Qrcode("lector");
  try {
    await escaner.start(
      {facingMode: "environment"},
      {fps: 10, qrbox: {width: 230, height: 230}},
      (codigo) => { $("buscar-texto").value = codigo; buscarSku(codigo); },
      () => {},
    );
  } catch (e) {
    cerrarEscaner();
    $("buscar-resultado").innerHTML = "<div class='card'>No se pudo abrir la cámara. Da permiso de cámara al navegador.</div>";
  }
}

function cerrarEscaner() {
  if (escaner) { try { escaner.stop().catch(()=>{}); } catch(e){} escaner = null; }
  const l = $("lector");
  if (l) { l.classList.add("oculto"); l.innerHTML = ""; }
}

function pintarEmpleada(data) {
  const e = data.empleada;
  $("emp-hola").textContent = `Hola, ${data.nombre} 👋`;
  $("emp-fecha").textContent = fechaLarga(hoyISO());
  let partes = [`⭐ Comisiones desde tu último pago: ${e.comisiones_ciclo}`];
  if (e.siguiente_descanso) partes.push(`🛌 Descansas el ${fechaLarga(e.siguiente_descanso)}`);
  if (e.proximo_pago) partes.push(`💵 Próximo pago: ${fechaLarga(e.proximo_pago)}` +
    (e.dias_para_pago === 0 ? " — ¡hoy!" :
      e.dias_para_pago === 1 ? " (falta 1 día)" : ` (faltan ${e.dias_para_pago} días)`));
  $("emp-banner").innerHTML = partes.join("<br>");
  calY = e.calendario.year; calM = e.calendario.month;
  pintarCalendario(e.calendario);
  mostrar("empleada");
}

function pintarCalendario(cal) {
  $("cal-titulo").textContent = `${MESES[cal.month-1]} ${cal.year}`;
  const hoy = hoyISO();
  let html = DIAS.map(d => `<div class="cab">${d}</div>`).join("");
  const primero = new Date(cal.year, cal.month-1, 1);
  const offset = (primero.getDay() + 6) % 7;  // lunes primero
  html += '<div class="vacio dia"></div>'.repeat(offset);
  const fechas = Object.keys(cal.dias).sort();
  for (const iso of fechas) {
    const estado = cal.dias[iso];
    const clase = estado === "trabajo" ? "" : estado;
    const esHoy = iso === hoy ? " hoy" : "";
    html += `<div class="dia ${clase}${esHoy}">${Number(iso.slice(8))}</div>`;
  }
  $("cal-grid").innerHTML = html;
}

async function moverMes(delta) {
  calM += delta;
  if (calM < 1) { calM = 12; calY--; }
  if (calM > 12) { calM = 1; calY++; }
  pintarCalendario(await api(`/api/v1/movil/calendario?year=${calY}&month=${calM}`));
}

function filaCorte(c) {
  return `<div class="fila"><span>${fechaLarga(c.fecha)}</span>` +
         `<span class="monto">${pesos(c.monto)}</span></div>`;
}

// ── Encargado (León): espejo de su modo del kiosko ────────────────
let encData = null, encSel = {};

async function pintarEncargado(_data) {
  mostrar("encargado");
  encMenu();
  try { encData = await api("/api/v1/movil/encargado"); } catch (e) { encData = null; }
  const enTienda = encData && encData.modo === "tienda";
  $("enc-modo").textContent = enTienda
    ? "Conectado a la tienda" : "Fuera de la tienda: solo puedes consultar";
  const desc = (encData && encData.descansos_semana) || [];
  $("enc-descansos").innerHTML = "<strong>🛌 Descansos estos días</strong>" +
    (desc.length ? desc.map(d =>
      `<div class="fila"><span>${fechaLarga(d.fecha)}</span><span>${d.nombres.join(", ")}</span></div>`).join("")
     : "<div class='fila'>Nadie tiene descanso programado.</div>");
}

function encMenu() {
  $("enc-menu").classList.remove("oculto");
  $("enc-sub").innerHTML = "";
}

function encSub(html) {
  $("enc-menu").classList.add("oculto");
  $("enc-sub").innerHTML = html;
}

function encVerCortes() {
  const cortes = (encData && encData.cortes) || [];
  encSub(`<h1>Cortes</h1><p class="sub">Los más recientes primero</p>` +
    (cortes.length ? `<div class="card">${cortes.map(filaCorte).join("")}</div>`
                   : `<div class="card">Todavía no hay cortes guardados.</div>`) +
    `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
}

function encRequiereTienda() {
  if (encData && encData.modo === "tienda") return true;
  encSub(`<div class="listo-texto">Esto solo funciona<br>estando en la tienda. 🏬</div>` +
    `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
  return false;
}

function encApuntar() {
  if (!encRequiereTienda()) return;
  const eq = (encData && encData.equipo) || [];
  encSub(`<h1>¿De quién quieres apuntar algo?</h1>` +
    eq.map(e => `<button class="btn-grande" onclick="encElegir('${e.codigo}','${e.nombre}')">👤  ${e.nombre}</button>`).join("") +
    `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
}

function encElegir(codigo, nombre) {
  encSel = {codigo, nombre};
  encSub(`<h1>¿Qué pasó con ${nombre}?</h1>` +
    `<button class="btn-grande" onclick="encTipo('falta')">🚫  Faltó</button>` +
    `<button class="btn-grande" onclick="encTipo('descanso')">🛌  Le doy descanso</button>` +
    `<button class="btn-suave" onclick="encApuntar()">← Regresar</button>`);
}

function encTipo(tipo) {
  encSel.tipo = tipo;
  const hoy = new Date(), man = new Date(Date.now() + 86400000);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  encSub(`<h1>¿Qué día?</h1>` +
    `<button class="btn-grande" style="background:var(--acento);color:#fff;border:none" onclick="encMarcar('${iso(hoy)}')">Hoy (${fechaLarga(iso(hoy))})</button>` +
    `<button class="btn-grande" onclick="encMarcar('${iso(man)}')">Mañana (${fechaLarga(iso(man))})</button>` +
    `<input type="date" id="enc-fecha" style="margin-top:4px">` +
    `<button class="btn-grande" onclick="encMarcar(document.getElementById('enc-fecha').value)">📅  Ese otro día</button>` +
    `<button class="btn-suave" onclick="encElegir('${encSel.codigo}','${encSel.nombre}')">← Regresar</button>`);
}

async function encPost(ruta, body) {
  const r = await fetch(ruta, {method: "POST",
    headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error("post");
  return r.json();
}

async function encMarcar(fecha) {
  if (!fecha) return;
  try {
    await encPost("/api/v1/movil/encargado/marcar",
      {employee_code: encSel.codigo, fecha, tipo: encSel.tipo});
  } catch (e) {
    encSub(`<div class="listo-texto">No se guardó. 😕<br>Inténtalo otra vez.</div>` +
      `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
    return;
  }
  encSel.fecha = fecha;
  const verbo = encSel.tipo === "falta" ? "faltó" : "descansa";
  encSub(`<div class="listo-texto">✅ Apuntado:<br><br>${encSel.nombre} ${verbo} el ${fechaLarga(fecha)}.</div>` +
    `<button class="btn-grande" style="background:var(--acento);color:#fff;border:none" onclick="encListo()">✅  Listo</button>` +
    `<button class="btn-suave" onclick="encDeshacer()">❌  Me equivoqué (borrar)</button>`);
}

async function encListo() { await pintarEncargado(); }

async function encDeshacer() {
  try {
    await encPost("/api/v1/movil/encargado/marcar",
      {employee_code: encSel.codigo, fecha: encSel.fecha, tipo: "quitar"});
    encSub(`<div class="listo-texto">Borrado. Como si nada. 👍</div>` +
      `<button class="btn-grande" onclick="encListo()">✅  Listo</button>`);
  } catch (e) {
    encSub(`<div class="listo-texto">No se borró. 😕</div>` +
      `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
  }
}

async function encCorteHoy() {
  if (!encRequiereTienda()) return;
  let datos;
  try { datos = await api("/api/v1/movil/encargado/corte_hoy"); }
  catch (e) { encMenu(); return; }
  if (!datos.hay_ventas) {
    encSub(`<div class="listo-texto">Hoy todavía no hay ventas.</div>` +
      `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
    return;
  }
  encSub(`<h1>Corte de hoy</h1>` +
    `<div class="listo-texto">VENTA DE HOY:<br><br>${pesos(datos.venta)}</div>` +
    `<button class="btn-grande" style="background:var(--acento);color:#fff;border:none" onclick="encHacerCorte()">🖨  Imprimir corte</button>` +
    `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
}

async function encHacerCorte() {
  try {
    const r = await encPost("/api/v1/movil/encargado/corte", {});
    encSub(`<div class="listo-texto">✅ Corte hecho:<br><br>${pesos(r.monto)}` +
      (r.ticket_encolado ? "<br><br>🖨 El ticket está saliendo en la impresora de la tienda." : "") +
      `</div><button class="btn-grande" onclick="encListo()">✅  Listo</button>`);
  } catch (e) {
    encSub(`<div class="listo-texto">No se pudo hacer el corte. 😕</div>` +
      `<button class="btn-suave" onclick="encMenu()">← Regresar</button>`);
  }
}

function pintarDueno(data) {
  const d = data.dueno;
  $("dueno-fecha").textContent = fechaLarga(hoyISO());
  $("d-venta").textContent = pesos(d.hoy.venta);
  $("d-detalle").textContent = `${d.hoy.operaciones} operaciones · ${d.hoy.piezas} piezas`;
  $("d-ranking").innerHTML = d.ranking.length ? d.ranking.map(r =>
    `<div class="fila"><span>${r.nombre.split(" ")[0]} <span class="pill">${r.comisiones} com · ${r.piezas} pz</span></span>` +
    `<span class="monto">${pesos(r.monto)}</span></div>`).join("")
    : "<div class='fila'>Sin movimientos hoy.</div>";
  $("d-ciclos").innerHTML = d.ciclos.map(c =>
    `<div class="fila"><span>${c.nombre.split(" ")[0]}` +
    (c.proximo_pago ? ` <span class="pill">paga ${fechaLarga(c.proximo_pago).split(" ")[0]} ${c.proximo_pago.slice(8)}</span>` : "") +
    `</span><span class="monto">${c.comisiones_ciclo} com.</span></div>`).join("") || "<div class='fila'>Sin ciclos aún.</div>";
  $("d-cortes").innerHTML = d.cortes.map(filaCorte).join("") || "<div class='fila'>Aún no hay cortes.</div>";
  mostrar("dueno");
}

// ── Jalar hacia abajo para actualizar ──────────────────────────────
const ptr = document.createElement("div");
ptr.id = "ptr"; ptr.textContent = "↓";
document.body.appendChild(ptr);
let ptrY0 = null, ptrDist = 0, ptrOcupado = false;
const PTR_UMBRAL = 48;

function ptrElegible() {
  if (!token || ptrOcupado || window.scrollY > 0) return false;
  const vista = ["empleada", "encargado", "dueno"].find(
    v => !$("vista-" + v).classList.contains("oculto"));
  return Boolean(vista);
}

document.addEventListener("touchstart", (e) => {
  ptrY0 = ptrElegible() ? e.touches[0].clientY : null;
  ptrDist = 0;
}, {passive: true});

document.addEventListener("touchmove", (e) => {
  if (ptrY0 === null) return;
  ptrDist = Math.min((e.touches[0].clientY - ptrY0) * 0.5, 90);
  if (ptrDist > 6 && window.scrollY === 0) {
    ptr.style.top = (ptrDist - 50) + "px";
    ptr.textContent = ptrDist >= PTR_UMBRAL ? "↻" : "↓";
  }
}, {passive: true});

document.addEventListener("touchend", async () => {
  if (ptrY0 === null) return;
  const suelto = ptrDist; ptrY0 = null;
  if (suelto >= PTR_UMBRAL) {
    ptrOcupado = true;
    ptr.style.top = "16px"; ptr.textContent = "↻"; ptr.classList.add("girando");
    try { await cargarInicio(); } catch (e) {}
    ptr.classList.remove("girando");
    ptrOcupado = false;
  }
  ptr.style.top = "-56px"; ptrDist = 0;
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
(token ? cargarInicio().catch(cargarLogin) : cargarLogin());
</script>
</body>
</html>
