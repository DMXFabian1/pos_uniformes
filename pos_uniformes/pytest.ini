[pytest]
markers =
    db: necesita un PostgreSQL real accesible (lento, puede fallar fuera de la tienda)
    qt: necesita PyQt6 / QApplication (lento, abre widgets)

# Los markers se aplican SOLOS: no hay que decorar cada test.
# Ver tests/conftest.py — clasifica cada archivo leyendo su codigo fuente.
#
# Mientras construyes (segundos): solo el archivo que tocas, o lo puro:
#     pytest pos_uniformes/tests/test_lo_que_toque.py
#     pytest pos_uniformes/tests --fast
#
# Antes de subir a produccion (TODO, ~28 s repartido en 6 procesos):
#     pytest pos_uniformes/tests -n 6 --dist load
#
#   -n 6 y no mas: la Mac tiene 4 nucleos rapidos; con 8 no mejora.
#   --dist load reparte PRUEBA por prueba (no archivo por archivo): el
#   archivo test_main_window_snapshot_cache tarda 41 s el solo, y por
#   archivo se quedaba en un proceso marcando el piso. Cada proceso trae su
#   propia QApplication, asi que las pruebas de Qt se estorban MENOS que en
#   serie, no mas. Requiere pytest-xdist (requirements-dev.txt).
#
#   Medido el 2026-09-10: serie 80 s · -n 4 loadfile 59 s · -n 6 load 27-32 s.
#   Una falla intermitente vista 1 vez en 13 corridas paralelas:
#   test_quote_satellite_window::test_catalog_status_label_is_not_shown_in_browser_layout
#   (no se pudo reproducir; si reaparece, ahi esta el nombre).
#
# Solo un grupo:
#     pytest pos_uniformes/tests -m db
#     pytest pos_uniformes/tests -m "not qt"
