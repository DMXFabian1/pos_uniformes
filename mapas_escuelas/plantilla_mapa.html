<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuelas — San Felipe, Gto.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; }
  #panel { width: 360px; overflow-y: auto; background: #faf6ef; border-left: 1px solid #d8cbb8; padding: 0 14px 14px; box-sizing: border-box; }
  .cabeza { position: sticky; top: 0; z-index: 5; background: #faf6ef; padding: 12px 0 8px; margin-bottom: 2px; border-bottom: 1px solid #ece2d2; }
  .titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 17px; margin: 0; color: #6b1f3a; }
  .sub { font-size: 11px; color: #8a7a66; margin: 1px 0 8px; }
  #buscador { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d8cbb8; border-radius: 8px; font-size: 13px; background: #fff; }
  #buscador:focus { outline: 2px solid #6b1f3a33; border-color: #6b1f3a; }
  .rotulo { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: #8a7a66; text-transform: uppercase; margin: 12px 0 6px; display: flex; justify-content: space-between; }
  .rotulo span { font-weight: 400; letter-spacing: 0; text-transform: none; }
  #niveles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .nv { background: #fff; border: 1px solid #e6dccc; border-radius: 10px; padding: 7px 9px 8px; cursor: pointer; user-select: none; transition: opacity .15s; }
  .nv:hover { border-color: #cdbca3; }
  .nv.off { opacity: .4; }
  .nv-nombre { font-size: 11.5px; color: #5c4c39; display: flex; align-items: center; }
  .nv-cifra { font-size: 17px; font-weight: 700; color: #3d2f20; margin: 1px 0 4px; }
  .nv-cifra small { font-size: 11px; font-weight: 400; color: #8a7a66; }
  .nv-barra { height: 4px; border-radius: 2px; background: #efe6d8; overflow: hidden; }
  .nv-barra i { display: block; height: 100%; border-radius: 2px; }
  #semaforo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sem { background: #fff; border: 1px solid #e6dccc; border-left: 4px solid; border-radius: 8px; padding: 5px 8px; cursor: pointer; user-select: none; }
  .sem b { font-size: 16px; display: block; }
  .sem span { font-size: 10.5px; color: #5c4c39; line-height: 1.2; display: block; }
  .sem.on { background: #fdf3e8; box-shadow: 0 0 0 2px #6b1f3a; border-color: transparent; }
  .sem.cero { opacity: .45; }
  #compartidos { font-size: 11px; color: #5c4c39; margin-top: 6px; line-height: 1.5; }
  #compartidos b { color: #3d2f20; }
  details.mas { background: #fff; border: 1px solid #e6dccc; border-radius: 8px; padding: 0 9px; margin: 6px 0 0; }
  details.mas[open] { padding-bottom: 8px; }
  details.mas summary { text-transform: none; letter-spacing: 0; font-size: 12px; color: #5c4c39; padding: 7px 0; }
  details.mas summary .activos { background: #6b1f3a; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 10.5px; margin-left: 4px; }
  .fila-res { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; }
  .vista { display: flex; gap: 4px; margin-bottom: 10px; }
  .vista button { flex: 1; padding: 6px 0; border: 1px solid #d8cbb8; border-radius: 7px; background: #fff; color: #5c4c39; font-size: 11.5px; cursor: pointer; }
  .vista button:hover { border-color: #6b1f3a; color: #6b1f3a; }
  .vista button.icono { flex: 0 0 36px; }
  .link { background: none; border: none; color: #6b1f3a; font-size: 11.5px; cursor: pointer; padding: 0; text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 20px; cursor: pointer; user-select: none; background: #fff; border: 1.5px solid transparent; color: #3d2f20; }
  .chips-tipo .chip { font-size: 11px; padding: 3px 8px; color: #5c4c39; }
  .chip .dot { width: 9px; height: 9px; }
  .chip.off { opacity: 0.35; }
  .seg { display: flex; margin-bottom: 6px; border: 1px solid #d8cbb8; border-radius: 8px; overflow: hidden; }
  .seg div { flex: 1; text-align: center; font-size: 12px; padding: 6px 2px; cursor: pointer; background: #fff; color: #5c4c39; user-select: none; }
  .seg div.on { background: #6b1f3a; color: #fff; }
  #distWrap { font-size: 12px; color: #5c4c39; margin-bottom: 6px; }
  .switch { font-size: 12.5px; color: #5c4c39; cursor: pointer; user-select: none; margin-bottom: 6px; display: block; }
  select { font-size: 12px; padding: 4px 6px; border: 1px solid #d8cbb8; border-radius: 6px; background: #fff; color: #3d2f20; }
  #selLoc { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 6px; }
  #resultado { font-size: 11.5px; color: #8a7a66; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
  .dot.hueco { background: transparent !important; border: 2.5px solid; }
  details { margin-bottom: 6px; }
  summary { font-size: 12.5px; font-weight: 600; color: #6b1f3a; cursor: pointer; padding: 4px 2px; text-transform: uppercase; letter-spacing: .4px; }
  summary .cnt { color: #a08f79; font-weight: 400; }
  .item { padding: 6px 9px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; background: #fff; border: 1px solid #e6dccc; border-left: 4px solid #e6dccc; font-size: 12.5px; line-height: 1.3; }
  .item:hover { background: #f3ead9; }
  .item b { color: #3d2f20; font-weight: 600; }
  .item.op { background: #fffdf9; }
  .item.op b { font-weight: 500; color: #5c4c39; }
  .item .addr { color: #857662; font-size: 11px; margin-left: 17px; }
  .item .como { font-size: 11px; font-weight: 600; margin: 2px 0 0 17px; }
  .prob { color: #b06a00; font-weight: 700; }
  .note { font-size: 11.5px; color: #8a7a66; background: #f3ead9; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .marker-cliente { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px #0005; box-sizing: border-box; }
  .marker-op { border-radius: 50%; background: #fff9 !important; border: 3px solid; box-shadow: 0 1px 3px #0004; box-sizing: border-box; }
  .cluster { background: #6b1f3ad9; color: #fff; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; box-shadow: 0 1px 4px #0005; }
  .leaflet-popup-content { font-size: 12.5px; line-height: 1.45; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px; background: #2e8b57; color: #fff; margin-left: 4px; }
  .badge.no { background: #a08f79; }
  .est-fila { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .est-btn { font-size: 10.5px; padding: 3px 7px; border-radius: 8px; border: 1px solid #d8cbb8; background: #faf6ef; cursor: pointer; color: #5c4c39; }
  .est-btn.on { background: #6b1f3a; color: #fff; border-color: #6b1f3a; }
  .seg-tag { font-size: 12px; }
  @media print {
    #panel, .leaflet-control-zoom { display: none !important; }
    #map { width: 100% !important; height: 100vh !important; }
  }
  .salud{margin-top:8px;padding:6px 8px;border-left:3px solid #999;background:rgba(0,0,0,.04);border-radius:4px}
  .salud-cifras{font-size:11px;color:#5f594f;margin-top:2px}
  .salud-punto{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .leyenda-salud{font-size:11px;color:#5f594f;margin-top:4px}
  #frescura{font-size:10.5px;font-weight:600;border-radius:10px;padding:1px 8px;background:#eef6ef;color:#2f6b3a}
  #frescura.vieja{background:#fff4d6;color:#7a5b00}
  .leyenda-mapa{background:#fffdf9;border:1px solid #e0d2bd;border-radius:10px;padding:8px 10px;font:11.5px system-ui,sans-serif;color:#3d2f20;box-shadow:0 1px 4px #0002;line-height:1.7}
  .leyenda-mapa b{font-size:11px;letter-spacing:.4px;color:#6b1f3a}
  .lg-punto{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div class="cabeza">
      <div class="titulo"><h1>Escuelas de San Felipe</h1></div>
      <div class="sub">Cabecera + comunidades cliente · directorio SEP</div>
      <input id="buscador" type="search" placeholder="Buscar escuela, comunidad o CCT…">
    </div>
    <div class="rotulo">Cobertura en el pueblo <span>toca para filtrar</span></div>
    <div id="niveles"></div>
    <div class="rotulo">Cómo van los conteos <span id="frescura"></span></div>
    <div id="semaforo"></div>
    <div id="compartidos"></div>
    <div class="rotulo">Qué escuelas ver</div>
    <div class="seg" id="segModo">
      <div data-m="todas">Todas</div>
      <div data-m="clientes">Clientes</div>
      <div data-m="oportunidades">Oportunidades</div>
    </div>
    <div id="distWrap" style="display:none">A menos de
      <select id="selDist">
        <option value="0">cualquier distancia</option>
        <option value="1">1 km</option>
        <option value="3">3 km</option>
        <option value="5">5 km</option>
        <option value="10">10 km</option>
      </select> de un cliente tuyo
    </div>
    <details class="mas" id="masFiltros">
      <summary>Más filtros<span class="activos" id="masActivos" style="display:none"></span></summary>
      <div class="chips chips-tipo" id="chipsTipo"></div>
      <label class="switch"><input type="checkbox" id="swRural"> Mostrar escuelas rurales (resto del municipio)</label>
      <select id="selLoc"><option value="">Todas las comunidades</option></select>
      <select id="selSeg" style="width:100%; box-sizing:border-box; padding:6px 8px">
        <option value="">Seguimiento: todas</option>
        <option value="sin">Sin contactar</option>
        <option value="contactada">📞 Contactadas</option>
        <option value="platica">🤝 En plática</option>
        <option value="ganada">⭐ Ganadas</option>
        <option value="no">✖ No les interesa</option>
      </select>
    </details>
    <div class="fila-res">
      <div id="resultado"></div>
      <button class="link" id="btnLimpiar">Quitar filtros</button>
    </div>
    <div class="vista">
      <button id="btnPueblo">Ver el pueblo</button>
      <button id="btnTodo">Ver el municipio</button>
      <button id="btnPrint" class="icono" title="Imprimir el mapa">🖨</button>
    </div>
    <div id="listas"></div>
    <div class="note" id="pendientes"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<!-- Cómo va cada escuela, AL DÍA: lo escribe el Panel cada vez que se regenera
     (2026-11-07). Sin este archivo, el mapa usa el estado con que se generó. -->
<script src="estados_pos.js"></script>
<script>
/*__DATOS__*/

// Los mismos colores de nivel que el Panel, más suaves (2026-11-07).
// Cómo va la escuela en el POS (lo dice escuela_estado_service, aquí solo se
// pinta): rojo = no sabemos qué hay, ámbar = le falta contarse, verde = al día.
const SALUD = { rojo: "#c0392b", ambar: "#e08b1e", verde: "#3d6b2f" };
const SALUD_TXT = { rojo: "no sabemos qué hay", ambar: "le falta contarse", verde: "al día" };

// ---- El estado fresco del POS (estados_pos.js), si está ----
const ESTADO_FRESCO = (typeof window.ESTADOS_POS === "object" && window.ESTADOS_POS) || null;
if (ESTADO_FRESCO && ESTADO_FRESCO.escuelas) {
  const cuantos = {};
  ESCUELAS.forEach(e => { if (e.pos && ESTADO_FRESCO.escuelas[e.pos]) cuantos[e.pos] = (cuantos[e.pos] || 0) + 1; });
  ESCUELAS.forEach(e => {
    const s = e.pos ? ESTADO_FRESCO.escuelas[e.pos] : null;
    e.estado = s ? { ...s, comparten: cuantos[e.pos] || 1 } : (e.pos ? {} : e.estado);
  });
}

const C = { Pre: "#8a6bbf", Pri: "#4a7fb8", Sec: "#3a9a8a", Bach: "#c9733a", Otro: "#9aa0a6" };
const NIVEL = { Pre: "Preescolar", Pri: "Primaria", Sec: "Secundaria", Bach: "Bachillerato", Otro: "Otros" };
const TIPO_TXT = { telesec: "Telesecundaria", sabes: "SABES", telebach: "Telebachillerato",
                   conalep: "Conalep", tecnica: "Sec. Técnica", particular: "Particular",
                   conafe: "CONAFE", capacitacion: "Capacitación" };
const TIPOS_CHIP = { General: "Generales", Telesec: "Telesec", Conafe: "CONAFE",
                     Particular: "Particulares", Sabes: "SABES", Telebach: "Telebach" };

const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esCabecera = e => {
  const l = norm(e.localidad);
  return (l === "san felipe" || l.includes("san felipe centro")) && !l.includes("estacion");
};
const esRural = e => !!e.rural;
const chipTipo = e => ({ telesec: "Telesec", conafe: "Conafe", particular: "Particular",
                         sabes: "Sabes", telebach: "Telebach" }[e.tipo] || "General");

const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap", maxZoom: 19,
}).addTo(map);
// Las burbujas tapaban los anillos: en el pueblo se agrupa menos, y cada
// burbuja toma el color de la peor escuela que trae adentro (2026-11-07).
const PEOR = { rojo: 3, ambar: 2, verde: 1, "": 0 };
const cluster = L.markerClusterGroup({
  maxClusterRadius: 20,
  disableClusteringAtZoom: 14,
  showCoverageOnHover: false,
  iconCreateFunction: c => {
    let peor = "";
    c.getAllChildMarkers().forEach(m => { const s = m.options.salud || ""; if (PEOR[s] > PEOR[peor]) peor = s; });
    const anillo = peor ? `box-shadow:0 0 0 3px ${SALUD[peor]}` : "";
    return L.divIcon({
      className: "", iconSize: [30, 30],
      html: `<div class="cluster" style="width:30px;height:30px;${anillo}" title="${peor ? "la peor: " + SALUD_TXT[peor] : ""}">${c.getChildCount()}</div>`,
    });
  },
});
map.addLayer(cluster);

// Seguimiento de campaña por escuela (persistido aparte de los filtros)
const ESTADOS = { contactada: "📞", platica: "🤝", ganada: "⭐", no: "✖" };
const ESTADOS_TXT = { contactada: "Contactada", platica: "En plática", ganada: "Ganada", no: "No le interesa" };
let SEG = {};
try { SEG = JSON.parse(localStorage.getItem("mapaEscuelasSeguimiento") || "{}"); } catch (err) {}

// Cómo va la escuela en el POS (lo dice escuela_estado_service, aquí solo se
// pinta): rojo = no sabemos qué hay (nunca se contó, o se vendió sin contar),
// ámbar = le falta contarse, verde = al día.

function plural(n, una, muchas) {
  return n === 1 ? una : muchas;
}

function saludDe(e) {
  return (e.estado && e.estado.salud) || "";
}

// Un registro del POS puede cubrir varios planteles (SABES son 13). Todos
// enseñan el mismo estado, así que el de los demás es prestado: se pinta más
// tenue para que una sola talla en rojo no parezca trece problemas.
function comparteEstado(e) {
  return !!(e.estado && e.estado.comparten > 1);
}

function estadoHtml(e) {
  const s = e.estado;
  if (!s || !s.salud) return "";
  const cifras = [
    `${s.pct_al_dia}% contada`,
    s.agotadas ? `${s.agotadas} ${plural(s.agotadas, "talla agotada", "tallas agotadas")}` : "",
    s.vendido ? `${s.vendido} ${plural(s.vendido, "pieza vendida", "piezas vendidas")} (30 d)` : "",
    s.pedido ? `${s.pedido} ${plural(s.pedido, "talla", "tallas")} por pedir` : "",
    s.faltas ? `${plural(s.faltas, "una vez", s.faltas + " veces")} que la pidieron y no había` : "",
  ].filter(Boolean).join(" · ");
  const compartido = s.comparten > 1
    ? `<div class="salud-cifras"><i>Es el estado de <b>${e.pos}</b>, que cubre ${s.comparten} planteles.</i></div>`
    : "";
  return `<div class="salud" style="border-color:${SALUD[s.salud]}">` +
         `<b style="color:${SALUD[s.salud]}">${s.titular}</b>` +
         compartido +
         `<div class="salud-cifras">${cifras}</div>` +
         (s.ultimo && s.ultimo !== "nunca" ? `<div class="salud-cifras">se contó ${s.ultimo}</div>` : "") +
         `</div>`;
}

function icono(e) {
  const color = C[e.nivel] || C.Otro;
  // tamaño proporcional a la matrícula
  const extra = Math.min(9, Math.sqrt(e.alumnos || 0) / 3);
  const est = SEG[e.cct];
  const badge = est ? `<span style="position:absolute;top:-9px;right:-9px;font-size:11px">${ESTADOS[est]}</span>` : "";
  if (e.cliente) {
    const s = Math.round(14 + extra);
    // El relleno sigue diciendo el nivel; el anillo dice cómo va en el POS.
    const salud = saludDe(e);
    // El anillo solo cuando el estado es **de esta escuela**. Si el registro del
    // POS cubre varios planteles (SABES son 13), una sola talla en rojo pintaría
    // trece anillos rojos y parecería un incendio: el estado no está en ningún
    // plantel en particular, así que en el mapa no se pinta. Sigue en la ficha
    // y en la lista, dicho con todas sus letras.
    const anillo = salud && !comparteEstado(e) ? `box-shadow:0 0 0 3px ${SALUD[salud]}` : "";
    return L.divIcon({ className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
      html: `<div class="marker-cliente" style="position:relative;width:${s}px;height:${s}px;background:${color};${anillo}">${badge}</div>` });
  }
  const s = Math.round(10 + extra);
  return L.divIcon({ className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    html: `<div class="marker-op" style="position:relative;width:${s}px;height:${s}px;border-color:${color}">${badge}</div>` });
}

function popupHtml(e) {
  const tipoTxt = TIPO_TXT[e.tipo] ? ` · ${TIPO_TXT[e.tipo]}` : "";
  const turno = e.turno ? ` · ${e.turno}` : "";
  const badge = e.cliente ? '<span class="badge">cliente</span>' : '<span class="badge no">sin registrar</span>';
  const prob = e.probable ? "<br><i>ubicación probable</i>" : "";
  const pos = e.cliente && e.pos && norm(e.pos) !== norm(e.nombre) ? `<br>En tu POS: <b>${e.pos}</b>` : "";
  const nota = e.nota ? `<br><i>${e.nota}</i>` : "";
  const al = e.alumnos ? `<br><b>${e.alumnos} alumnos</b>` : "";
  const contacto = [
    e.director ? `Dir. ${e.director}` : "",
    e.tel ? `<a href="tel:${e.tel.replace(/\D/g, "")}">${e.tel}</a>` : "",
    e.correo || "",
  ].filter(Boolean).join(" · ");
  const cont = contacto ? `<br><small>${contacto}</small>` : "";
  const est = SEG[e.cct] || "";
  const botones = Object.keys(ESTADOS).map(k =>
    `<button class="est-btn${est === k ? " on" : ""}" onclick="setEstado('${e.cct}','${k}')">${ESTADOS[k]} ${ESTADOS_TXT[k]}</button>`
  ).join("");
  return `<b>${e.nombre}</b>${badge}${pos}${nota}${al}<br>${NIVEL[e.nivel]}${tipoTxt}${turno}` +
         `<br>${e.domicilio || e.localidad}${cont}<br><small>${e.localidad} · CCT ${e.cct}</small>${prob}` +
         estadoHtml(e) +
         `<div class="est-fila">${botones}</div>`;
}

ESCUELAS.forEach(e => {
  e._gk = esCabecera(e) ? "__pueblo__" : (norm(e.localidad) || "sin localidad");
  // `salud` va en el marcador para que la burbuja que lo agrupe sepa su color
  // (sin el de los planteles que comparten estado: ese no es de ellos).
  e._m = L.marker([e.lat, e.lon], { icon: icono(e), salud: comparteEstado(e) ? "" : saludDe(e) })
    .bindPopup(() => popupHtml(e))
    .bindTooltip(e.nombre, { direction: "top", offset: [0, -8] });
});
const porCct = Object.fromEntries(ESCUELAS.map(e => [e.cct, e]));

window.setEstado = (cct, estado) => {
  SEG[cct] = SEG[cct] === estado ? "" : estado;  // segundo clic lo quita
  if (!SEG[cct]) delete SEG[cct];
  try { localStorage.setItem("mapaEscuelasSeguimiento", JSON.stringify(SEG)); } catch (err) {}
  const e = porCct[cct];
  e._m.setIcon(icono(e));
  if (e._m.isPopupOpen()) e._m.setPopupContent(popupHtml(e));
  if (e._tag) e._tag.textContent = SEG[cct] ? ` ${ESTADOS[SEG[cct]]}` : "";
  // solo refiltrar si hay filtro de seguimiento activo (aplica() cierra el popup)
  if (F.seg) aplica();
};

// ---- Distancia mínima de cada escuela a un cliente (para Oportunidades) ----
const clientes = ESCUELAS.filter(e => e.cliente);
const RAD = Math.PI / 180;
function kmEntre(a, b) {
  const s = Math.sin((b.lat - a.lat) * RAD / 2) ** 2 +
    Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin((b.lon - a.lon) * RAD / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(s));
}
ESCUELAS.forEach(e => {
  e._dkm = e.cliente ? 0 : Math.min(...clientes.map(c => kmEntre(e, c)));
});

// ---- Estado de filtros (persistido en localStorage) ----
const DEFAULTS = {
  niveles: { Pre: true, Pri: true, Sec: true, Bach: true, Otro: true },
  tipos: { General: true, Telesec: true, Conafe: true, Particular: true, Sabes: true, Telebach: true },
  modo: "todas", rural: false, dist: 0, loc: "", seg: "", salud: "",
};
let F = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const g = JSON.parse(localStorage.getItem("mapaEscuelasFiltros") || "null");
  if (g) F = { ...F, ...g, niveles: { ...F.niveles, ...g.niveles }, tipos: { ...F.tipos, ...g.tipos } };
} catch (err) { /* localStorage no disponible: sin persistencia */ }
let textoBusqueda = "";

function visible(e) {
  if (!F.niveles[e.nivel]) return false;
  if (!F.tipos[chipTipo(e)]) return false;
  if (F.modo === "clientes" && !e.cliente) return false;
  if (F.modo === "oportunidades") {
    if (e.cliente) return false;
    if (F.dist && e._dkm > F.dist) return false;
  }
  // con comunidad elegida o búsqueda activa se ignora el switch rural:
  // si lo estás buscando, lo quieres ver
  if (!F.loc && !textoBusqueda && e.rural && !F.rural) return false;
  if (F.loc && e._gk !== F.loc) return false;
  if (F.seg === "sin" && SEG[e.cct]) return false;
  if (F.seg && F.seg !== "sin" && SEG[e.cct] !== F.seg) return false;
  if (F.salud && saludDe(e) !== F.salud) return false;
  if (textoBusqueda) {
    const blob = norm(`${e.nombre} ${e.pos} ${e.localidad} ${e.cct}`);
    if (!blob.includes(textoBusqueda)) return false;
  }
  return true;
}

function persiste() {
  try { localStorage.setItem("mapaEscuelasFiltros", JSON.stringify(F)); } catch (err) {}
}

function aplica() {
  const vis = ESCUELAS.filter(visible);
  cluster.clearLayers();
  cluster.addLayers(vis.map(e => e._m));
  ESCUELAS.forEach(e => { if (e._fila) e._fila.style.display = visible(e) ? "" : "none"; });
  document.querySelectorAll("#listas details").forEach(d => {
    const filas = [...d.querySelectorAll(".item")];
    const nVis = filas.filter(f => f.style.display !== "none").length;
    d.style.display = nVis ? "" : "none";
    d.querySelector(".cnt").textContent = `(${nVis})`;
    if (textoBusqueda && nVis) d.open = true;
  });
  document.getElementById("distWrap").style.display = F.modo === "oportunidades" ? "" : "none";
  document.getElementById("resultado").textContent =
    `${vis.length} de ${ESCUELAS.length} escuelas`;
  // «Más filtros» dice cuántos tiene puestos, para que no se olviden cerrados.
  const extras = Object.values(F.tipos).filter(v => !v).length + (F.niveles.Otro ? 0 : 1) +
    (F.rural ? 1 : 0) + (F.loc ? 1 : 0) + (F.seg ? 1 : 0);
  const masAct = document.getElementById("masActivos");
  masAct.textContent = extras;
  masAct.style.display = extras ? "" : "none";
  document.getElementById("btnLimpiar").style.visibility =
    (textoBusqueda || JSON.stringify(F) !== JSON.stringify(DEFAULTS)) ? "visible" : "hidden";
  persiste();
}

// ---- Chips de nivel y tipo ----
function creaChips(contId, claves, textos, colores, grupo) {
  const cont = document.getElementById(contId);
  claves.forEach(k => {
    const ch = document.createElement("div");
    ch.className = "chip" + (F[grupo][k] ? "" : " off");
    ch.innerHTML = (colores ? `<span class="dot" style="background:${colores[k]}"></span>` : "") + textos[k];
    ch.onclick = () => { F[grupo][k] = !F[grupo][k]; ch.classList.toggle("off", !F[grupo][k]); aplica(); };
    ch.dataset.k = k; ch.dataset.g = grupo;
    cont.appendChild(ch);
  });
}
creaChips("chipsTipo", Object.keys(TIPOS_CHIP), TIPOS_CHIP, null, "tipos");
creaChips("chipsTipo", ["Otro"], NIVEL, C, "niveles");

// ---- Niveles: la cobertura en el pueblo, y cada tarjeta filtra su nivel ----
(() => {
  const cab = ESCUELAS.filter(e => esCabecera(e) && e.nivel !== "Otro");
  const cont = document.getElementById("niveles");
  ["Pre", "Pri", "Sec", "Bach"].forEach(nv => {
    const del = cab.filter(e => e.nivel === nv);
    const cl = del.filter(e => e.cliente).length;
    const pct = del.length ? Math.round(100 * cl / del.length) : 0;
    const d = document.createElement("div");
    d.className = "nv";
    d.dataset.k = nv; d.dataset.g = "niveles";
    d.title = `${cl} de ${del.length} escuelas del pueblo son clientes · toca para ${"mostrar u ocultar"} ${NIVEL[nv].toLowerCase()}`;
    d.innerHTML = `<div class="nv-nombre"><span class="dot" style="background:${C[nv]}"></span>${NIVEL[nv]}</div>` +
      `<div class="nv-cifra">${cl}<small> de ${del.length} clientes</small></div>` +
      `<div class="nv-barra"><i style="width:${pct}%;background:${C[nv]}"></i></div>`;
    d.onclick = () => { F.niveles[nv] = !F.niveles[nv]; d.classList.toggle("off", !F.niveles[nv]); aplica(); };
    cont.appendChild(d);
  });
})();

// ---- Semáforo: cuántas escuelas en cada color; tocar uno filtra ----
const SEM_TXT = { rojo: "no sabemos qué hay", ambar: "les falta contarse", verde: "al día" };
function pintaSalud() {
  document.querySelectorAll(".sem").forEach(x => x.classList.toggle("on", x.dataset.s === F.salud));
}
(() => {
  const cont = document.getElementById("semaforo");
  ["rojo", "ambar", "verde"].forEach(s => {
    // Un registro del POS que cubre varios planteles (SABES son 13) cuenta una
    // vez: si no, «18 no sabemos qué hay» serían 5 escuelas y SABES 13 veces.
    const n = new Set(ESCUELAS.filter(e => saludDe(e) === s).map(e => comparteEstado(e) ? "pos:" + e.pos : e.cct)).size;
    const d = document.createElement("div");
    d.className = "sem" + (n ? "" : " cero");
    d.dataset.s = s;
    d.style.borderLeftColor = SALUD[s];
    d.innerHTML = `<b style="color:${SALUD[s]}">${n}</b><span>${SEM_TXT[s]}</span>`;
    d.onclick = () => { F.salud = F.salud === s ? "" : s; pintaSalud(); aplica(); };
    cont.appendChild(d);
  });
})();

// ---- Selector de modo ----
function pintaModo() {
  document.querySelectorAll("#segModo div").forEach(x => x.classList.toggle("on", x.dataset.m === F.modo));
}
document.querySelectorAll("#segModo div").forEach(el => {
  el.onclick = () => { F.modo = el.dataset.m; pintaModo(); aplica(); };
});

// ---- Distancia (solo en Oportunidades) ----
document.getElementById("selDist").onchange = ev => { F.dist = +ev.target.value; aplica(); };

// ---- Switch rural ----
document.getElementById("swRural").onchange = ev => {
  F.rural = ev.target.checked;
  aplica();
  if (F.rural && !F.loc) encuadra(() => true, 0.05);
};

// ---- Búsqueda ----
document.getElementById("buscador").oninput = ev => {
  textoBusqueda = norm(ev.target.value.trim());
  aplica();
};

// ---- Lista agrupada por localidad + selector de comunidad ----
const listas = document.getElementById("listas");
const porLocalidad = new Map();
const etiqueta = new Map();
ESCUELAS.forEach(e => {
  if (!porLocalidad.has(e._gk)) {
    porLocalidad.set(e._gk, []);
    etiqueta.set(e._gk, e._gk === "__pueblo__" ? "San Felipe (pueblo)" : (e.localidad || "Sin localidad"));
  }
  porLocalidad.get(e._gk).push(e);
});
const grupos = [...porLocalidad.keys()].sort((a, b) =>
  (a === "__pueblo__" ? -1 : b === "__pueblo__" ? 1 : etiqueta.get(a).localeCompare(etiqueta.get(b))));
const ordenNv = ["Pre", "Pri", "Sec", "Bach", "Otro"];
grupos.forEach((g, gi) => {
  const det = document.createElement("details");
  if (gi === 0) det.open = true;
  const arr = porLocalidad.get(g).sort((a, b) =>
    ordenNv.indexOf(a.nivel) - ordenNv.indexOf(b.nivel) || (b.cliente - a.cliente) || a.nombre.localeCompare(b.nombre));
  det.innerHTML = `<summary>${etiqueta.get(g)} <span class="cnt">(${arr.length})</span></summary>`;
  arr.forEach(e => {
    const d = document.createElement("div");
    d.className = "item" + (e.cliente ? "" : " op");
    const dotCls = e.cliente ? "dot" : "dot hueco";
    const style = e.cliente ? `background:${C[e.nivel]}` : `border-color:${C[e.nivel]}`;
    const extraNv = TIPO_TXT[e.tipo] ? ` · ${TIPO_TXT[e.tipo]}` : "";
    const al = e.alumnos ? `${e.alumnos} al. · ` : "";
    const salud = saludDe(e);
    const prestado = comparteEstado(e);
    const titulo = SALUD_TXT[salud] + (prestado ? ` (de ${e.pos}, ${e.estado.comparten} planteles)` : "");
    // El estado ya no es un segundo puntito: borde izquierdo de su color y, si
    // no está al día, dicho en una línea (2026-11-07).
    if (salud) {
      d.style.borderLeftColor = SALUD[salud];
      if (prestado) d.style.borderLeftStyle = "dashed";
      d.title = titulo;
    }
    const como = salud && salud !== "verde"
      ? `<div class="como" style="color:${SALUD[salud]}">${e.estado.titular}${prestado ? ` · de ${e.pos}` : ""}</div>` : "";
    d.innerHTML = `<span class="${dotCls}" style="${style}"></span>` +
      `<b>${e.probable ? '<span class="prob">~</span> ' : ""}${e.nombre}</b>` +
      `<span class="seg-tag">${SEG[e.cct] ? " " + ESTADOS[SEG[e.cct]] : ""}</span>` +
      como +
      `<div class="addr">${al}${NIVEL[e.nivel]}${extraNv}${e.turno ? " · " + e.turno : ""}${e.domicilio ? " · " + e.domicilio : ""}</div>`;
    d.onclick = () => cluster.zoomToShowLayer(e._m, () => e._m.openPopup());
    e._fila = d;
    e._tag = d.querySelector(".seg-tag");
    det.appendChild(d);
  });
  listas.appendChild(det);
});

const selLoc = document.getElementById("selLoc");
grupos.forEach(g => {
  const op = document.createElement("option");
  op.value = g;
  op.textContent = etiqueta.get(g);
  selLoc.appendChild(op);
});
if (F.loc && !porLocalidad.has(F.loc)) F.loc = "";
selLoc.onchange = () => {
  F.loc = selLoc.value;
  aplica();
  if (F.loc) encuadra(e => e._gk === F.loc, 0.25);
  else encuadra(esCabecera, 0.1);
};
document.getElementById("selSeg").onchange = ev => { F.seg = ev.target.value; aplica(); };

// ---- Clientes que cubren varios planteles ----
// Su estado no está en ningún punto del mapa (pintarlo repetiría el mismo aviso
// en cada plantel), así que se dice aquí para que no se pierda de vista.
(() => {
  const vistos = new Map();
  ESCUELAS.forEach(e => {
    if (comparteEstado(e) && e.estado.salud !== "verde") vistos.set(e.pos, e.estado);
  });
  const caja = document.getElementById("compartidos");
  if (!vistos.size) { caja.style.display = "none"; return; }
  caja.innerHTML = [...vistos.entries()].map(
    ([nombre, s]) => `<span class="salud-punto" style="background:${SALUD[s.salud]}"></span>` +
      `<b>${nombre}</b> · ${s.comparten} planteles · ${s.titular}`
  ).join("<br>");
})();

// ---- De cuándo es el estado ----
(() => {
  const el = document.getElementById("frescura");
  if (!ESTADO_FRESCO || !ESTADO_FRESCO.generado) {
    el.textContent = "sin actualizar";
    el.title = "Es el estado del día que se generó el mapa";
    el.classList.add("vieja");
    return;
  }
  const min = Math.max(0, Math.round((Date.now() - new Date(ESTADO_FRESCO.generado)) / 60000));
  const txt = min < 1 ? "recién" : min < 60 ? `hace ${min} min` : min < 1440 ? `hace ${Math.round(min / 60)} h`
    : `hace ${Math.round(min / 1440)} día${Math.round(min / 1440) === 1 ? "" : "s"}`;
  el.textContent = txt;
  el.title = `Conteos actualizados ${txt}`;
  el.classList.toggle("vieja", min >= 60 * 12);
})();

// ---- Leyenda sobre el mapa ----
(() => {
  const ley = L.control({ position: "bottomleft" });
  ley.onAdd = () => {
    const d = L.DomUtil.create("div", "leyenda-mapa");
    d.innerHTML = "<b>CÓMO SE LEE</b><br>" +
      Object.entries(NIVEL).filter(([k]) => k !== "Otro").map(([k, n]) =>
        `<span class="lg-punto" style="background:${C[k]}"></span>${n}`).join(" &nbsp; ") + "<br>" +
      `<span class="lg-punto" style="background:#bbb;box-shadow:0 0 0 2.5px ${SALUD.rojo}"></span>no sabemos qué hay &nbsp; ` +
      `<span class="lg-punto" style="background:#bbb;box-shadow:0 0 0 2.5px ${SALUD.ambar}"></span>le falta contarse &nbsp; ` +
      `<span class="lg-punto" style="background:#bbb;box-shadow:0 0 0 2.5px ${SALUD.verde}"></span>al día<br>` +
      `<span class="lg-punto" style="background:transparent;border:2px solid #888"></span>sin registrar (aún no es cliente)`;
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  ley.addTo(map);
})();

// ---- Pendientes ----
document.getElementById("pendientes").innerHTML =
  "<b>Pendientes de ubicar:</b><br>" + PENDIENTES.join("<br>") +
  "<br><span class='prob'>~</span> = ubicación probable";

// ---- Vistas ----
function encuadra(filtro, pad) {
  let pts = ESCUELAS.filter(e => visible(e) && filtro(e)).map(e => [e.lat, e.lon]);
  if (!pts.length) pts = ESCUELAS.filter(filtro).map(e => [e.lat, e.lon]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(pad));
}
document.getElementById("btnPueblo").onclick = () => encuadra(esCabecera, 0.1);
document.getElementById("btnTodo").onclick = () => encuadra(() => true, 0.05);
document.getElementById("btnPrint").onclick = () => window.print();
window.addEventListener("beforeprint", () => map.invalidateSize());
window.addEventListener("afterprint", () => map.invalidateSize());

// ---- Sincronizar controles con el estado (carga y Limpiar) ----
function sincronizaUI() {
  document.querySelectorAll("[data-g]").forEach(ch => ch.classList.toggle("off", !F[ch.dataset.g][ch.dataset.k]));
  pintaModo();
  pintaSalud();
  document.getElementById("selDist").value = String(F.dist);
  document.getElementById("swRural").checked = F.rural;
  selLoc.value = F.loc;
  document.getElementById("selSeg").value = F.seg || "";
}
document.getElementById("btnLimpiar").onclick = () => {
  F = JSON.parse(JSON.stringify(DEFAULTS));
  textoBusqueda = "";
  document.getElementById("buscador").value = "";
  sincronizaUI();
  aplica();
  encuadra(esCabecera, 0.1);
};

sincronizaUI();
aplica();
if (F.loc) encuadra(e => e._gk === F.loc, 0.25);
else encuadra(esCabecera, 0.1);

// Si la página cargó con el contenedor sin tamaño (panel oculto/miniatura),
// el fitBounds inicial queda en zoom mundial: reintentar cuando ya mida algo.
const reencuadreInicial = () => {
  map.invalidateSize();
  if (map.getZoom() < 5) {
    if (F.loc) encuadra(e => e._gk === F.loc, 0.25); else encuadra(esCabecera, 0.1);
    aplica();  // reconstruye los clusters, que se calcularon con el mapa en 0x0
  }
};
setTimeout(reencuadreInicial, 500);
setTimeout(reencuadreInicial, 1600);
window.addEventListener("resize", reencuadreInicial);
</script>
