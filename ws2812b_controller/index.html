<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09090f">
<link rel="manifest" href="/manifest.json">
<title>LED Control</title>
<style>
:root{
  --bg:#09090f;--card:#111120;--border:#1c1c32;
  --accent:#00e5ff;--accent2:#ff2d78;--text:#dde0ff;--muted:#5a5a7a;
  --radius:14px;--gap:10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* ── Header ── */
header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 8px;border-bottom:1px solid var(--border);
  background:var(--bg);
}
.logo{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(#ff2d78,#a855f7,#00e5ff,#00ff88,#ff2d78);
  animation:spin 3s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hinfo{flex:1;min-width:0}
.hinfo h1{font-size:17px;font-weight:700;letter-spacing:.4px}
.hinfo p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:all .4s}
.dot.ok{background:#00ff88;box-shadow:0 0 7px #00ff88}
.dot.err{background:#ff2d78;box-shadow:0 0 7px #ff2d78}

/* ── Nav tabs ── */
nav{
  display:flex;background:var(--bg);
  border-bottom:1px solid var(--border);
}
nav button{
  flex:1;padding:9px 4px 7px;
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:color .2s,border-color .2s;
}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Panels ── */
.panels{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.panel{
  position:absolute;inset:0;overflow-y:auto;
  padding:var(--gap);display:none;
  padding-bottom:calc(var(--gap) + var(--safe-bottom));
}
.panel.active{display:block}

/* ── Effect grid ── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eff{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:9px 4px 8px;cursor:pointer;color:var(--text);
  font-size:10.5px;line-height:1.3;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  min-height:70px;justify-content:center;
  transition:transform .12s,border-color .2s,background .2s;
  user-select:none;
}
.eff .ic{font-size:22px;line-height:1}
.eff:active{transform:scale(.93)}
.eff.active{
  border-color:var(--accent);background:#00e5ff12;
  box-shadow:0 0 14px #00e5ff25;
}

/* ── Section label ── */
.sec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px}
.sec:first-child{margin-top:2px}

/* ── Color panel ── */
.preview{
  width:100%;height:76px;border-radius:var(--radius);
  border:1.5px solid var(--border);margin-bottom:var(--gap);
  cursor:pointer;transition:background .15s;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:rgba(255,255,255,.4);
}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.row label{font-size:13px;font-weight:700;width:14px;text-align:center}
input[type=range]{
  flex:1;-webkit-appearance:none;height:5px;
  border-radius:3px;background:var(--border);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 8px var(--accent);
}
.rval{font-size:12px;width:28px;text-align:right;color:var(--muted)}
input[type=color]{
  width:100%;height:44px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:var(--card);
  cursor:pointer;padding:3px;display:block;
}

/* ── Config panel ── */
.card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
}
.clabel{
  font-size:11px;color:var(--muted);margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
}
.clabel span{color:var(--accent);font-weight:700;font-size:13px}
.off-btn{
  width:100%;padding:12px;border-radius:var(--radius);
  background:#ff2d7818;border:1.5px solid #ff2d78;
  color:#ff2d78;font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s;
}
.off-btn:active{background:#ff2d7830}

/* ── Toast ── */
.toast{
  position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;
  transform:translateX(-50%);
  background:#1a1a2e;border:1px solid var(--accent);
  color:var(--accent);padding:8px 22px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:99;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <div class="hinfo">
    <h1>LED Control</h1>
    <p id="lbl">Conectando...</p>
  </div>
  <div class="dot" id="dot"></div>
</header>

<nav>
  <button class="active" onclick="tab('effects',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
    Efectos
  </button>
  <button onclick="tab('color',this)">
    <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
    Color
  </button>
  <button onclick="tab('cfg',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Config
  </button>
</nav>

<div class="panels">

<!-- ── EFECTOS ── -->
<div class="panel active" id="panel-effects">
  <p class="sec">Animaciones</p>
  <div class="grid" id="grid-anim"></div>
  <p class="sec">Ambiente</p>
  <div class="grid" id="grid-amb"></div>
  <p class="sec">Dramáticos</p>
  <div class="grid" id="grid-drama"></div>
</div>

<!-- ── COLOR ── -->
<div class="panel" id="panel-color">
  <div class="preview" id="preview" onclick="document.getElementById('cpick').click()">
    Toca para abrir selector
  </div>
  <input type="color" id="cpick" style="display:none" oninput="onPick(this.value)">

  <p class="sec">RGB Manual</p>
  <div class="row">
    <label style="color:#ff6b6b">R</label>
    <input type="range" id="rs" min="0" max="255" oninput="onRGB()">
    <span class="rval" id="rv">255</span>
  </div>
  <div class="row">
    <label style="color:#69ff47">G</label>
    <input type="range" id="gs" min="0" max="255" oninput="onRGB()">
    <span class="rval" id="gv">0</span>
  </div>
  <div class="row">
    <label style="color:#5eaeff">B</label>
    <input type="range" id="bs" min="0" max="255" oninput="onRGB()">
    <span class="rval" id="bv">0</span>
  </div>

  <p class="sec">Paletas rápidas</p>
  <div class="grid" id="grid-pal"></div>
</div>

<!-- ── CONFIG ── -->
<div class="panel" id="panel-cfg">
  <p class="sec">Ajustes globales</p>
  <div class="card">
    <div class="clabel">Brillo <span id="bv2">60%</span></div>
    <input type="range" id="bslider" min="0" max="100" value="60"
      oninput="onBrightness(this.value)">
  </div>
  <div class="card">
    <div class="clabel">Velocidad <span id="sv2">30 ms</span></div>
    <input type="range" id="sslider" min="5" max="200" value="30"
      oninput="onSpeed(this.value)">
  </div>
  <div class="card">
    <button class="off-btn" onclick="send({cmd:'off'})">⏻ Apagar LEDs</button>
  </div>
</div>

</div><!-- /panels -->

<div class="toast" id="toast"></div>

<script>
// ── Datos ────────────────────────────────────────────────────────────────────
const ANIM = [
  {id:'rainbow',        ic:'🌈', label:'Rainbow'},
  {id:'glitter_rainbow',ic:'✨', label:'Glitter'},
  {id:'rainbow_chase',  ic:'🎠', label:'Chase'},
  {id:'color_shift',    ic:'🎨', label:'Color Shift'},
  {id:'running_lights', ic:'💡', label:'Running'},
  {id:'theater_chase',  ic:'🎭', label:'Teatro'},
  {id:'scanner',        ic:'👁️', label:'Scanner'},
  {id:'bounce',         ic:'🔵', label:'Bounce'},
  {id:'breathe',        ic:'💙', label:'Respirar'},
  {id:'heartbeat',      ic:'❤️', label:'Latido'},
  {id:'comet',          ic:'🌠', label:'Cometa'},
  {id:'meteor',         ic:'☄️', label:'Meteoro'},
];
const AMB = [
  {id:'fire',      ic:'🔥', label:'Fuego'},
  {id:'plasma',    ic:'⚡', label:'Plasma'},
  {id:'aurora',    ic:'🌌', label:'Aurora'},
  {id:'lava_lamp', ic:'🫧', label:'Lava Lamp'},
  {id:'matrix_rain',ic:'💚',label:'Matrix'},
  {id:'hyperspace',ic:'🚀', label:'Hiperespacio'},
  {id:'twinkle',   ic:'⭐', label:'Twinkle'},
  {id:'sparkle',   ic:'💫', label:'Chispas'},
];
const DRAMA = [
  {id:'lightning', ic:'🌩️', label:'Relámpago'},
  {id:'strobe',    ic:'⚪', label:'Strobe'},
];
const PALS = [
  {label:'Rojo',    r:255,g:0,  b:0  },
  {label:'Naranja', r:255,g:80, b:0  },
  {label:'Dorado',  r:255,g:200,b:20 },
  {label:'Verde',   r:0,  g:255,b:0  },
  {label:'Cian',    r:0,  g:255,b:220},
  {label:'Azul',    r:0,  g:100,b:255},
  {label:'Violeta', r:180,g:0,  b:255},
  {label:'Rosa',    r:255,g:0,  b:120},
  {label:'Blanco',  r:255,g:255,b:255},
];

// ── Build UI ─────────────────────────────────────────────────────────────────
function buildGrid(containerId, items) {
  const g = document.getElementById(containerId);
  items.forEach(e => {
    const b = document.createElement('button');
    b.className = 'eff';
    b.id = 'e-' + e.id;
    b.innerHTML = '<span class="ic">' + e.ic + '</span>' + e.label;
    b.onclick = () => activateEffect(e.id, b);
    g.appendChild(b);
  });
}
buildGrid('grid-anim', ANIM);
buildGrid('grid-amb', AMB);
buildGrid('grid-drama', DRAMA);

// Paletas
const pg = document.getElementById('grid-pal');
PALS.forEach(p => {
  const hex = '#' + [p.r,p.g,p.b].map(v=>v.toString(16).padStart(2,'0')).join('');
  const b = document.createElement('button');
  b.className = 'eff';
  b.innerHTML = '<span class="ic" style="width:24px;height:24px;border-radius:50%;background:'+hex+';display:block;box-shadow:0 0 8px '+hex+'80"></span>' + p.label;
  b.onclick = () => { send({cmd:'color',r:p.r,g:p.g,b:p.b}); updatePreview(p.r,p.g,p.b); };
  pg.appendChild(b);
});

// ── API ──────────────────────────────────────────────────────────────────────
let _dbt = null;
function send(payload, immediate) {
  clearTimeout(_dbt);
  _dbt = setTimeout(() => _doSend(payload), immediate ? 0 : 80);
}

async function _doSend(payload) {
  try {
    const r = await fetch('/api/cmd', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(3000)
    });
    const d = await r.json();
    setDot('ok');
    if (d.effect) document.getElementById('lbl').textContent = 'Efecto: ' + d.effect;
  } catch(e) {
    setDot('err');
    toast('Sin conexión con el ESP32');
  }
}

async function pollStatus() {
  try {
    const r = await fetch('/api/status', {signal: AbortSignal.timeout(2500)});
    const d = await r.json();
    setDot('ok');
    document.getElementById('lbl').textContent = 'Efecto: ' + (d.effect || '—');
    document.getElementById('bslider').value = Math.round(d.brightness * 100);
    document.getElementById('bv2').textContent = Math.round(d.brightness * 100) + '%';
    document.getElementById('sslider').value = d.speed || 30;
    document.getElementById('sv2').textContent = (d.speed || 30) + ' ms';
    markActive(d.effect);
  } catch(e) { setDot('err'); }
}

// ── Controles ────────────────────────────────────────────────────────────────
function activateEffect(id, btn) {
  send({cmd:'effect', name:id});
  markActive(id);
}

function markActive(id) {
  document.querySelectorAll('.eff').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('e-' + id);
  if (btn) btn.classList.add('active');
}

function updatePreview(r, g, b) {
  const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('preview').style.background = hex;
  document.getElementById('preview').textContent = '';
  document.getElementById('cpick').value = hex;
  document.getElementById('rs').value = r;
  document.getElementById('gs').value = g;
  document.getElementById('bs').value = b;
  document.getElementById('rv').textContent = r;
  document.getElementById('gv').textContent = g;
  document.getElementById('bv').textContent = b;
}

function onRGB() {
  const r = +document.getElementById('rs').value;
  const g = +document.getElementById('gs').value;
  const b = +document.getElementById('bs').value;
  document.getElementById('rv').textContent = r;
  document.getElementById('gv').textContent = g;
  document.getElementById('bv').textContent = b;
  const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('preview').style.background = hex;
  document.getElementById('preview').textContent = '';
  document.getElementById('cpick').value = hex;
  send({cmd:'color', r, g, b});
}

function onPick(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  updatePreview(r, g, b);
  send({cmd:'color', r, g, b});
}

function onBrightness(v) {
  document.getElementById('bv2').textContent = v + '%';
  send({cmd:'brightness', value: v/100});
}

function onSpeed(v) {
  document.getElementById('sv2').textContent = v + ' ms';
  send({cmd:'speed', value: +v});
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function tab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── Utils ────────────────────────────────────────────────────────────────────
function setDot(state) {
  const d = document.getElementById('dot');
  d.className = 'dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
}

let _tt = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ─────────────────────────────────────────────────────────────────────
pollStatus();
setInterval(pollStatus, 6000);

// Service Worker (inline blob para funcionar sin HTTPS)
if ('serviceWorker' in navigator) {
  const sw = `
self.addEventListener('install',e=>e.waitUntil(
  caches.open('led-v1').then(c=>c.addAll(['/']))
));
self.addEventListener('fetch',e=>e.respondWith(
  fetch(e.request).catch(()=>caches.match(e.request))
));`;
  const blob = new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
