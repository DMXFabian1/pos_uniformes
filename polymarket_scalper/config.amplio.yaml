# Configuración del bot. Todo lo que afecta al comportamiento vive aquí.
data_dir: data

# Categorías a seguir. tag_id viene de https://gamma-api.polymarket.com/tags/slug/<slug>
categories:
  sports:
    tag_id: 1
    default_fee_rate: 0.05      # se usa solo si el mercado no trae feeSchedule
  politics:
    tag_id: 2
    default_fee_rate: 0.04

discovery:
  refresh_seconds: 300          # cada cuánto se vuelven a buscar mercados
  events_per_category: 300      # cuántos eventos (ordenados por volumen 24h) revisar por categoría
  min_volume_24h: 2000          # USD. Por debajo de esto no hay con quién operar
  max_markets: 400              # tope de mercados suscritos a la vez
  exclude_sports_market_types: []  # p.ej. ["child_moneyline"]

collector:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  assets_per_connection: 150    # tokens por conexión websocket
  flush_seconds: 30             # cada cuánto se escriben los buffers a Parquet
  flush_rows: 5000
  quote_sample_seconds: 5       # muestreo regular del top-of-book (tabla quotes)
  rest_resync_seconds: 900      # re-sincronizar cada libro por REST (protege contra deltas perdidos)
  resolution_poll_seconds: 600  # cada cuánto se revisan resoluciones de mercados ya vistos
  prevent_sleep: true           # Windows/macOS: impedir que el equipo se suspenda mientras el bot corre

sports_feed:
  enabled: true
  ws_url: wss://sports-api.polymarket.com/ws
  store_all_leagues: false      # true guarda todos los partidos del feed, no solo los enlazados a mercados

flow:
  enabled: true
  data_api_url: https://data-api.polymarket.com
  poll_seconds: 10
  page_size: 1000               # ~30 trades/s en toda la plataforma; 1000 cada 10 s deja margen
  min_usd_global: 500           # fuera de los mercados seguidos solo se guardan trades grandes
  whale_min_usd: 2000           # trade que dispara el perfilado de la wallet
  profile_max_pages: 10         # historial: hasta 500 posiciones cerradas por wallet
  profile_refresh_hours: 12
  per_wallet_delay_seconds: 1.5
  smart_min_score: 0.65         # umbral para considerar una wallet "dinero inteligente"
  smart_min_closed: 20

models:
  sigma_basketball: 16.2        # desviación del margen final a partido completo. NBA 2023-24: 16.2 (`scalper calibrate`)
  sigma_by_league: {nba: 16.2}  # por liga; otras usan sigma_basketball
  soccer_total_goals: 2.7
  pregame_proxy_max_progress: 0.15   # sin precio previo, solo se modela si el partido lleva < 15 %

updown:                         # mercados "Up or Down" de cripto (5 y 15 minutos)
  enabled: true
  series: [btc-up-or-down-5m, btc-up-or-down-15m]   # añade eth-…, sol-… si quieres más
  refresh_seconds: 20           # viven minutos: se descubren mucho más seguido que el resto
  max_markets: 12
  min_seconds_left: 45          # no entrar en el tramo final, donde el modelo ya no aporta
  min_edge_net: 0.03            # la comisión de cripto es 7 %: sin ventaja grande no compensa
  max_edge_net: 0.45            # por encima, casi siempre es un precio de apertura mal leído
  annual_vol: {}                # volatilidad anualizada por símbolo; vacío usa la típica de cada uno
  default_annual_vol: 0.6
  # Regla del motor: aquí se compra y se aguanta hasta la resolución. Vender antes paga la
  # comisión dos veces y se come la ventaja.

retention:                      # disco: book_deltas crece ~4 GB/día; el aprendizaje no los necesita
  enabled: true
  run_hours: 24                 # corre solo dentro del recolector; también a mano con `scalper retention`
  compact: true                 # días cerrados: un archivo por tabla en vez de ~2.900
  min_quiet_seconds: 3600       # nunca toca particiones con escrituras en la última hora
  keep_days:                    # tablas sin entrada se conservan para siempre
    book_deltas: 3
    book_snapshots: 14
    markets: 30                 # se reescribe cada 5 min; solo importa la última fila por mercado

learn:                          # fase 5: modelo que aprende del ledger
  enabled: true
  backend: auto                 # auto usa scikit-learn (gradient boosting) si está; si no, logística
  shrink_n: 50                  # con n_train ejemplos, peso del modelo = n/(n+50); el resto es heurística
  min_train: 30                 # por debajo de esto el modelo solo informa, no filtra ni dimensiona
  min_p_win: 0.5                # con modelo confiable, señales con P(ganar) menor se descartan
  size_floor: 0.2
  min_examples: 40              # mínimo de posiciones cerradas por tipo de señal para entrenar
  val_fraction: 0.3             # último 30 % temporal como validación
  retrain_hours: 6              # en paper trading, reentrenar y recargar cada 6 h

signals:
  maker_first: true             # poner órdenes en vez de cruzar el libro: la comisión es cero
  maker_entry_timeout_s: 90     # si la orden puesta no se llena en este tiempo, se cancela sin perder nada
  min_edge_net: 0.004           # ganancia mínima neta por share (USD) para emitir señal
  max_edge_net: 0.25            # por encima de esto se descarta: casi siempre es un libro roto
  target_size: 50               # shares objetivo por señal
  detect_interval_ms: 250       # no evaluar el mismo mercado más seguido que esto
  complement:
    enabled: true
  multi_outcome:
    enabled: true
    max_legs: 12
  spread:
    enabled: true
    min_spread_ticks: 3         # spread mínimo (en ticks) para postear dentro
    max_spread_ticks: 8         # más ancho es falta de liquidez: salir después cuesta más que el spread
    min_trades_per_minute: 0.3  # actividad mínima reciente
    trade_window_seconds: 300
    vol_window_seconds: 300
  model_deviation:              # in-play: modelo vs mercado
    enabled: true
    min_edge_net: 0.02          # USD por share tras fees de entrada y salida
    min_deviation: 0.04         # p_modelo - precio mínimo para mirar siquiera
    max_deviation: 0.35         # más que esto casi siempre es un marcador mal leído
    stop_fraction: 1.5          # stop = entrada - 1.5 × edge
    min_tau: 0.02               # no entrar con menos del 2 % del partido por jugar
    require_pregame: false
  smart_money:                  # seguir wallets con historial
    enabled: true
    min_edge_net: 0.01
    min_score: 0.65
    min_closed: 20
    min_usd: 1000               # tamaño mínimo del trade de la wallet
    max_chase_ticks: 3          # no perseguir si el ask ya subió más que esto sobre su precio
    edge_fraction_of_roi: 0.5   # hipótesis: capturamos la mitad de su ROI histórico
    max_price: 0.9

sim:
  latency_ms: 400               # retraso entre señal y ejecución
  slippage_ticks: 1             # ticks adicionales de penalización en órdenes taker
  fill_baseline_prob: 0.6       # solo referencia; los fills maker se simulan por cola
  max_hold_seconds: 600         # tiempo máximo con una posición de spread abierta
  max_hold_directional_seconds: 14400   # posiciones direccionales (modelo, dinero inteligente): 4 h
  max_entry_slip_ticks: 3       # si el precio se movió más que esto entre señal y ejecución, no entrar
  start_cash: 1000
  max_position_usd: 60
  max_open_positions: 15
  seed: 7
