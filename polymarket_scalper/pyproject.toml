[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-scalper"
version = "0.1.0"
description = "Bot de scalping para Polymarket (deportes y politica): recolector, señales y simulador"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pyarrow>=15",
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
learn = ["scikit-learn>=1.4"]
gui = ["PyQt6>=6.6", "PyQt6-WebEngine>=6.6"]

[project.scripts]
scalper = "scalper.cli:main"

[tool.setuptools.packages.find]
include = ["scalper*"]

[tool.setuptools.package-data]
scalper = ["dashboard/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
